{% extends 'base.html' %}
{% block title %}Edit player{% endblock %}
{% block content %}
<section class="page-head"><span class="eyebrow">{{ info.name }}</span><h1>Edit player</h1></section>
<section class="card panel"><form method="post" class="form"><div class="form-grid"><label>First name<input name="first_name" value="{{ player.first_name }}" required></label><label>Surname<input name="surname" value="{{ player.surname }}" required></label><label>Age<input name="age" type="number" min="10" max="99" value="{{ player.age }}" required></label><label>Gender<select name="gender" required>{% for g in ['Male','Female'] %}<option value="{{ g }}" {% if player.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Course<input name="course" value="{{ player.course }}" required></label><label>Set<input name="set_name" value="{{ player.set_name }}" required></label><label>Year<select name="year" required>{% for y in ['1st Year','2nd Year','3rd Year','4th Year'] %}<option value="{{ y }}" {% if player.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></label><label>Sport<select name="sport" required>{% for key, item in sports.items() %}<option value="{{ key }}" {% if player.sport == key %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>Position<select name="position" required>{% for p in info.positions %}<option value="{{ p }}" {% if player.position == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label></div><div class="actions"><button class="btn primary" type="submit">Save changes</button><a class="btn secondary" href="{{ url_for('admin_players') if current_user.role == 'admin' else url_for('student_home') }}">Back</a></div></form></section>
{% endblock %}
