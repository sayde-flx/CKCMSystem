{% extends 'base.html' %}
{% block title %}Player profile{% endblock %}
{% block content %}
<section class="page-head"><a class="back-link" href="{{ url_for('new_player_start') }}">&larr; My sports</a><span class="eyebrow">Player profile &middot; Step 2 of 2 &middot; {{ info.name }}</span><h1>Your player details</h1><p>Fill in your information. You can edit it later from Player profile.</p></section>
<section class="card panel"><form method="post" class="form"><div class="form-grid"><label>First name<input name="first_name" value="{{ (player or prefill).first_name if (player or prefill) else '' }}" required></label><label>Surname<input name="surname" value="{{ (player or prefill).surname if (player or prefill) else '' }}" required></label><label>Age<input name="age" type="number" min="10" max="99" value="{{ (player or prefill).age if (player or prefill) else '' }}" required></label><label>Gender<select name="gender" required><option value="">Select</option>{% for g in ['Male','Female'] %}<option value="{{ g }}" {% if (player or prefill) and (player or prefill).gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><label>Course<input name="course" value="{{ (player or prefill).course if (player or prefill) else '' }}" required></label><label>Set<input name="set_name" value="{{ (player or prefill).set_name if (player or prefill) else '' }}" required></label><label>Year<select name="year" required><option value="">Select</option>{% for y in ['1st Year','2nd Year','3rd Year','4th Year'] %}<option value="{{ y }}" {% if (player or prefill) and (player or prefill).year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></label><label>Position<select name="position" required><option value="">Select</option>{% for p in info.positions %}<option value="{{ p }}" {% if player and player.position == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label></div><div class="actions"><button class="btn primary" type="submit">{{ 'Save changes' if player else 'Submit' }}</button><a class="btn secondary" href="{{ url_for('student_home') }}">Back</a></div></form></section>
{% endblock %}
